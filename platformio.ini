[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
  bodmer/TFT_eSPI @ ^2.5.43
  https://github.com/PaulStoffregen/XPT2046_Touchscreen

build_flags =
  -D USER_SETUP_LOADED=1
  -D ILI9341_2_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_MISO=12
  
  ; --- ЦІ РЯДКИ ОБОЛОВ'ЯЗКОВІ ДЛЯ ОЖИВЛЕННЯ ТАЧУ В TFT_eSPI ---
  -D TOUCH_CS=33           ; Вказує CS пін для самої бібліотеки графики
  -D TOUCH_DRIVER=2046     ; Або використовуйте -D XPT2046_DRIVER=1
  
  -D SPI_FREQUENCY=55000000
  -D SPI_READ_FREQUENCY=20000000
  -D SPI_TOUCH_FREQUENCY=2000000  ; Знижено до стабільних 2 MHz
  
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D TFT_INVERSION_ON=1
